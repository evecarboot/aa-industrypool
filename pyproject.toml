[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aa-industrypool"
version = "0.2.0"
description = "Alliance Auth plugin to delegate and track corp industry build jobs via ESI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Your Alliance" }]
classifiers = [
    "Environment :: Web Environment",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "allianceauth>=5.2.0",
    "django-esi>=9.4",
    "django-eveuniverse>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/evecarboot/aa-industrypool"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["industrypool*"]
