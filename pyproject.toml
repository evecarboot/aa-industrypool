[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aa-industrypool"
version = "0.4.5"
description = "Alliance Auth plugin to delegate and track corp industry build jobs via ESI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Your Alliance" }]
classifiers = [
    "Environment :: Web Environment",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "allianceauth>=5.2.0",
    "django-eveuniverse>=1.3.0",
    "requests>=2.28",
]

[project.urls]
Homepage = "https://github.com/your-org/aa-industrypool"

[tool.setuptools.packages.find]
include = ["industrypool*"]
